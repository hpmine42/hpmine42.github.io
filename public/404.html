<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>404 — hpmine42</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121416" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <style>
      .lost {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        align-content: center;
        gap: 1.25rem;
        padding: var(--section-y) var(--gutter);
      }

      .lost__code {
        font-family: var(--font-mono);
        font-size: var(--step--1);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--signal);
      }

      .lost__title {
        margin: 0;
        font-size: clamp(3rem, 14vw, 9rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.05em;
      }

      .lost__text {
        max-width: 32em;
        color: var(--paper-muted);
      }

      .lost__links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 1.75rem;
        margin-top: 0.5rem;
        font-size: var(--step--1);
      }

      .lost__links a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        color: var(--paper);
        text-decoration: none;
        background-image: linear-gradient(currentColor, currentColor);
        background-repeat: no-repeat;
        background-position: 0 100%;
        background-size: 100% 1px;
        transition: background-size 0.35s var(--ease-out);
      }

      .lost__links a:hover,
      .lost__links a:focus-visible {
        background-size: 0 1px;
        background-position: 100% 100%;
      }
    </style>
  </head>
  <body>
    <main class="lost">
      <p class="lost__code">Error 404 · nothing here</p>
      <h1 class="lost__title">Lost?</h1>
      <p class="lost__text">
        This page does not exist. It might have been renamed, or it might never have been here in the
        first place.
      </p>
      <div class="lost__links">
        <a href="/">Back to the start</a>
        <a href="https://github.com/hpmine42?tab=repositories">Projects on GitHub</a>
      </div>
    </main>
  </body>
</html>
